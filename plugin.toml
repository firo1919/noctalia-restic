id           = "firomsa/restic"
name         = "Restic Backup"
version      = "0.1.0"
plugin_api   = 14
author       = "Firomsa"
license      = "MIT"
icon         = "cloud"
description  = "Monitor and manage Restic cloud backups with live status, one-click backup, unlock, prune, and journal logs."
dependencies = ["restic", "systemctl"]
tags         = ["backup", "system", "utility", "cloud"]

# ── General Settings ──────────────────────────────────────────────────────────

[[setting]]
key             = "service_name"
type            = "string"
label_key       = "settings.service_name.label"
description_key = "settings.service_name.description"
default         = "restic-backup.service"

[[setting]]
key             = "repository"
type            = "string"
label_key       = "settings.repository.label"
description_key = "settings.repository.description"
default         = "rclone:EncryptedGoogleDrive:Backups"

[[setting]]
key             = "password_command"
type            = "string"
label_key       = "settings.password_command.label"
description_key = "settings.password_command.description"
default         = "rbw get restic-pass"

# ── Panel ─────────────────────────────────────────────────────────────────────

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 460
height          = 560
placement       = "attached"
position        = "auto"
open_near_click = true

# ── Bar Widget ────────────────────────────────────────────────────────────────

[[widget]]
id    = "widget"
entry = "widget.luau"

  [widget.actions]
  left  = "panel.toggle panel"
  right = "exec systemctl --user start restic-backup.service"

  [[widget.setting]]
  key             = "show_status_text"
  type            = "bool"
  label_key       = "settings.show_status_text.label"
  description_key = "settings.show_status_text.description"
  default         = false

  [[widget.setting]]
  key             = "poll_interval_seconds"
  type            = "int"
  label_key       = "settings.poll_interval_seconds.label"
  description_key = "settings.poll_interval_seconds.description"
  default         = 6
  min             = 3
  max             = 60
